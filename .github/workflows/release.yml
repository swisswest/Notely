name: Release

# Ausgeloest durch einen Versions-Tag:
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Installer bauen und veroeffentlichen
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Tests
        run: |
          npm run typecheck
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installer bauen
        run: npm run tauri:build

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
          body: |
            ## Installation

            `Notely_*_x64-setup.exe` herunterladen und ausfuehren. Installation
            ins Benutzerprofil, keine Adminrechte noetig.

            Windows meldet beim ersten Start "unbekannter Herausgeber", weil die
            Datei nicht signiert ist: *Weitere Informationen* -> *Trotzdem ausfuehren*.

            Fuer die Aufgabenerkennung wird ein eigener Claude API-Key benoetigt
            (console.anthropic.com). Ohne Key funktioniert alles ausser der Analyse.
