name: Release

# Ausgeloest durch einen Versions-Tag:
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # um danach den Website-Workflow anzustossen

jobs:
  release:
    name: Installer bauen und veroeffentlichen
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Tests
        run: |
          npm run typecheck
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installer bauen
        run: npm run tauri:build

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          # Direkt veroeffentlichen, damit Website und /releases/latest sofort die neue Version liefern.
          # Tags mit Bindestrich (v0.6.0-beta.1) werden Vorabversionen und nie als "aktuell" angeboten.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
          body: |
            ## Installation

            `Notely_*_x64-setup.exe` herunterladen und ausfuehren. Installation
            ins Benutzerprofil, keine Adminrechte noetig.

            Windows meldet beim ersten Start "unbekannter Herausgeber", weil die
            Datei nicht signiert ist: *Weitere Informationen* -> *Trotzdem ausfuehren*.

            Fuer die Aufgabenerkennung wird ein eigener Claude API-Key benoetigt
            (console.anthropic.com). Ohne Key funktioniert alles ausser der Analyse.

      # Releases, die mit GITHUB_TOKEN erstellt werden, loesen keine anderen Workflows aus.
      # Deshalb die Website hier explizit neu bauen.
      - name: Website aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
